<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:20px;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:8px 0}
button{font:inherit;color:inherit;border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;min-height:52px}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue)}
.big{width:100%;margin:10px 0;font-size:26px;font-weight:800;background:var(--sun);color:#1d2b4f}
.big.b{background:var(--blue);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}.row>button{flex:1 1 90px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;margin:12px 0}
.w{font-size:42px;font-weight:800;text-align:center;margin:4px 0}.zh{text-align:center;font-size:24px}
.sent{font-size:28px;text-align:center;line-height:1.5}
input{font:inherit;font-size:32px;width:100%;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:10px;background:var(--card);color:var(--ink)}
.ok{color:var(--green)}.no{color:var(--red)}
mark{background:var(--sun);color:#1d2b4f;border-radius:6px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.back{margin-bottom:8px;min-height:44px;font-size:18px}
.sbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sbw{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px}
.sbw small{font-size:15px;opacity:.7}
.sbw span,.sw{font-family:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;font-size:30px;font-weight:700;letter-spacing:.05em}
.sbw.on{background:var(--sun);color:#1d2b4f}
.sbr{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0;text-align:left}
.sbr b{font-size:26px;min-width:44px}.sbr .sw{flex:1;visibility:hidden}.show .sbr .sw{visibility:visible}.sbr em{font-style:normal}
.sbr.dn{opacity:.55}.sbr.nx{border-color:var(--blue);background:var(--sun);color:#1d2b4f;opacity:1}
body{background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:28px 28px;-webkit-tap-highlight-color:transparent}
h1{text-align:center;font-size:36px}.sub{text-align:center;margin:0 0 12px}.hero{font-size:84px;text-align:center;margin-top:12px}
button{box-shadow:0 4px 0 var(--ink);transition:transform .08s}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}button:disabled{opacity:.4}
.card{box-shadow:0 6px 0 var(--ink)}
.w,.sent,input{font-family:'Andika','Comic Sans MS','Trebuchet MS',sans-serif}.w{font-size:48px}.zh{font-size:28px}
.wk{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.wk button{display:flex;flex-direction:column;align-items:center;padding:10px}.wk small{font-size:14px}.wk b{font-size:38px}
.mn button{font-size:26px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px}.mn span{font-size:48px}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-size:18px;vertical-align:middle}
.feat{width:100%;text-align:center;background:var(--sun);color:#1d2b4f;padding:16px;margin:8px 0}.feat b{display:block;font-size:34px}.feat small{display:block;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.chips i{font-style:normal;background:#fff;color:#1d2b4f;border:2px solid #1d2b4f;border-radius:999px;padding:2px 10px;font-family:'Andika','Comic Sans MS',sans-serif;font-size:17px}
.ol{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.ol button{display:flex;flex-direction:column;align-items:center;padding:12px 6px}.ol b{font-size:22px}.ol small{font-size:15px}
.wd{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.wc{display:flex;flex-direction:column;align-items:center;padding:10px 6px}.wc span{font-family:'Andika','Comic Sans MS',sans-serif;font-size:24px;font-weight:700}.wc small{font-size:17px}.wc.hot{background:var(--sun);color:#1d2b4f}
.pr{grid-template-columns:repeat(3,1fr)}.pr button{font-size:20px;padding:12px 4px}.pr span{font-size:34px}
.c0{background:#ffd95a;color:#1d2b4f}.c1{background:#7bd88f;color:#1d2b4f}.c2{background:#8ec5ff;color:#1d2b4f}.c3{background:#ffa7c4;color:#1d2b4f}.c4{background:#c8a8ff;color:#1d2b4f}
.ok,.no{font-weight:800}.ok::before{content:'🎉 '}.no::before{content:'💪 '}
</style></head><body><main id="app"></main>
